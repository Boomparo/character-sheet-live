name: Validate live sheet
on:
  push:
    branches: [main, v7s-modular-pass, v7s-ux-rest-stats]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check js/classes/treasure-hunter/data-v7s.js
          node --check js/classes/treasure-hunter/relics-v7s.js
          node --check js/classes/treasure-hunter/choices-v7s.js
          node --check js/core/state-v7s.js
          node --check js/core/rules-2024.js
          node --check js/core/derived-v7s.js
          node --check js/core/roster-v7s.js
          node --check js/core/catalog-srd.js
          node --check js/ui/portrait-cropper.js
          node --check js/ui/app-v8.js
          node --check js/ui/modular-enhancements.js
          node --check js/ui/stat-inspector-v7s.js
          node --check js/ui/rest-manager-v7s.js
          node --check service-worker.js
      - name: Required files
        run: |
          test -s index.html
          test -s css/v7s.css
          test -s css/ux-v7s.css
          test -s css/modular-v7s.css
          test -s css/enhancements-v7s.css
          test -s css/compact-ux-v7s.css
          test -s manifest.webmanifest
          test -s assets/icon.svg
      - name: Treasure Hunter data integrity
        run: |
          node <<'NODE'
          global.window={};
          require('./js/classes/treasure-hunter/data-v7s.js');
          require('./js/classes/treasure-hunter/relics-v7s.js');
          require('./js/classes/treasure-hunter/choices-v7s.js');
          const T=window.TreasureHunterDataV7s,R=window.TreasureHunterRelicsV7s;
          if(R.length!==38) throw new Error(`Expected 38 relics, got ${R.length}`);
          if(new Set(R.map(x=>x.id)).size!==38) throw new Error('Duplicate relic ids');
          const counts=R.reduce((o,r)=>(o[r.level]=(o[r.level]||0)+1,o),{});
          const expected={3:14,6:9,10:6,13:4,18:5};
          for(const [l,n] of Object.entries(expected)) if(counts[l]!==n) throw new Error(`Relic prerequisite level ${l}: expected ${n}, got ${counts[l]||0}`);
          if(Object.keys(counts).some(l=>!expected[l])) throw new Error(`Unexpected relic prerequisite levels: ${JSON.stringify(counts)}`);
          if(R.some(r=>!r.fullText||r.fullText.length<25)) throw new Error('Missing complete relic text');
          if(T.features.some(f=>!f.fullText||f.fullText.length<20)) throw new Error('Missing feature text');
          if(T.features.some(f=>f.id==='swinging')) throw new Error('Swinging must be merged into Swing');
          const swing=T.features.find(f=>f.id==='swing');if(!swing||!swing.fullText.includes('dvojnásobku')) throw new Error('Merged Swing rule is incomplete');
          if(T.coolTotal(20)!==20||T.coolDie(16)!=='d12'||T.pb(17)!==6) throw new Error('Treasure Hunter progression broken');
          if(JSON.stringify(T.relicLimit(14))!==JSON.stringify([5,5,10])) throw new Error('Relic capacity progression broken');
          for(const id of ['ancient-languages','drivers-license','specialized-expertise','weapon-mastery']) if(!T.choiceDefinitions[id]) throw new Error(`Missing choices for ${id}`);
          console.log('Treasure Hunter final data ok',counts);
          NODE
      - name: UX and rules regression guards
        run: |
          grep -q 'js/ui/app-v8.js' index.html
          grep -q 'js/ui/modular-enhancements.js' index.html
          grep -q 'js/core/derived-v7s.js' index.html
          grep -q 'js/ui/stat-inspector-v7s.js' index.html
          grep -q 'js/ui/rest-manager-v7s.js' index.html
          grep -q 'css/compact-ux-v7s.css' index.html
          grep -q 'WHIP / ROPE DC' js/ui/app-v8.js
          grep -q "\['free','FREE'\]" js/ui/app-v8.js
          grep -q "\['other','OTHER'\]" js/ui/app-v8.js
          grep -q 'Unarmed Strike' js/ui/app-v8.js
          grep -q 'V7SRoster' js/core/roster-v7s.js
          grep -q 'V7SItemCatalog' js/core/catalog-srd.js
          grep -q 'Immunities' js/core/rules-2024.js
          grep -q "\['Thunder','Thunder'\]" js/core/rules-2024.js
          grep -q "leather:{name:'Leather Armor',base:11,dex:true" js/core/derived-v7s.js
          grep -q 'fixedSaveMode' js/core/rules-2024.js
          grep -q 'Spend Hit Dice' js/ui/rest-manager-v7s.js
          grep -q 'Restore all spent Hit Point Dice' js/ui/rest-manager-v7s.js
          grep -q 'data-inspect-stat' js/ui/stat-inspector-v7s.js
          grep -q 'feature-use-control' js/ui/modular-enhancements.js
          grep -q 'cloak-pilgrim-worlds' js/ui/modular-enhancements.js
          ! grep -q "Imunita" js/core/rules-2024.js
