name: Validate V9
on:
  push:
    branches: [main, 'v9-*']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          for file in \
            js/classes/treasure-hunter/data-v7s.js \
            js/classes/treasure-hunter/relics-v7s.js \
            js/classes/treasure-hunter/choices-v7s.js \
            js/classes/treasure-hunter/content-v9.js \
            js/core/state-v9.js js/core/rules-2024.js js/core/origin-v9.js \
            js/core/derived-v9.js js/core/commands-v9.js js/core/roster-v9.js \
            js/core/catalog-srd.js js/ui/portrait-cropper.js js/ui/app-v9.js service-worker.js
          do
            node --check "$file"
          done
      - name: Domain and architecture behavior
        run: node --test tests/v9-domain.test.js
      - name: Static shell integrity
        run: |
          test -s index.html
          test -s manifest.webmanifest
          test -s css/v9.css
          test -s assets/icon.svg
          grep -q 'js/core/state-v9.js' index.html
          grep -q 'js/core/commands-v9.js' index.html
          grep -q 'js/ui/app-v9.js' index.html
          grep -q 'css/v9.css' index.html
          ! grep -q 'js/ui/gameplay-polish-v7s.js' index.html
          ! grep -q 'js/ui/modular-enhancements.js' index.html
          ! grep -q 'MutationObserver' js/ui/app-v9.js
          ! grep -q 'stopImmediatePropagation' js/ui/app-v9.js
          grep -q 'scroll-snap-type:x mandatory' css/v7s.css
          grep -q 'character-sheet-v9-ux-4' service-worker.js
          grep -q "service-worker.js?v=9.1.0" index.html
