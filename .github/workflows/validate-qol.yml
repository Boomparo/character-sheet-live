name: Validate QOL fixes
on:
  push:
    branches: [main, v8-qol-wallet-builder-fixes, v8-native-swipe-restore, v8-hp-temp-manager]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check js/ui/interaction-fixes-v8.js
          node --check js/ui/hp-manager-v8.js
          node --check js/ui/builder-checklist-v8.js
          node --check js/ui/swipe-controller-v8.js
          node --check js/ui/gameplay-polish-v7s.js
          node --check service-worker.js
      - name: Builder and feature guards
        run: |
          grep -q 'type="hidden" id="bStartMelee"' js/ui/interaction-fixes-v8.js
          grep -q 'patchExpertise' js/ui/interaction-fixes-v8.js
          grep -q 'patchMastery' js/ui/interaction-fixes-v8.js
          grep -q 'data-feature-choice' js/ui/interaction-fixes-v8.js
          grep -q 'stopImmediatePropagation' js/ui/interaction-fixes-v8.js
          grep -q 'Choose weapon type' js/ui/interaction-fixes-v8.js
          grep -q 'Starting equipment is not forced' js/ui/interaction-fixes-v8.js
      - name: Money and temp HP guards
        run: |
          test -s css/qol-fixes-v8.css
          test -s css/hp-v8.css
          grep -q 'moneyDialog' js/ui/interaction-fixes-v8.js
          grep -q "\['gp','GP','G'\]" js/ui/interaction-fixes-v8.js
          grep -q "\['ep','EP','E'\]" js/ui/interaction-fixes-v8.js
          grep -q "\['sp','SP','S'\]" js/ui/interaction-fixes-v8.js
          grep -q "\['cp','CP','C'\]" js/ui/interaction-fixes-v8.js
          ! grep -q 'data-coin-step' js/ui/interaction-fixes-v8.js
          grep -q 'TEMP ' js/ui/interaction-fixes-v8.js
          grep -q 'money-wallet' css/qol-fixes-v8.css
          grep -q 'money-edit-grid' css/qol-fixes-v8.css
          grep -q 'h.temp-=absorbed' js/ui/hp-manager-v8.js
          grep -q 'absorbed by Temp HP' js/ui/hp-manager-v8.js
          grep -q 'hpAmountWheel' js/ui/hp-manager-v8.js
          grep -q 'hpAmountInput' js/ui/hp-manager-v8.js
          grep -q 'Swipe the number wheel or type the exact amount' js/ui/hp-manager-v8.js
          grep -q 'temp-hp-chip' css/hp-v8.css
      - name: Native swipe guards
        run: |
          grep -q 'touch-action:pan-x pan-y' css/swipe-v8.css
          grep -q 'scroll-snap-type:x mandatory' css/swipe-v8.css
          grep -q 'flex:0 0 100%' css/swipe-v8.css
          grep -q 'NATIVE_SWIPE_RESTORED' js/ui/swipe-controller-v8.js
          ! grep -q 'pointermove' js/ui/swipe-controller-v8.js
          ! grep -q 'setPointerCapture' js/ui/swipe-controller-v8.js
          ! grep -q 'preventDefault' js/ui/swipe-controller-v8.js
      - name: Wiring
        run: |
          grep -q 'interaction-fixes-v8.js' js/ui/gameplay-polish-v7s.js
          grep -q 'hp-manager-v8.js' js/ui/gameplay-polish-v7s.js
          grep -q 'hp-v8.css' js/ui/gameplay-polish-v7s.js
          grep -q 'qol-fixes-v8.css' js/ui/gameplay-polish-v7s.js
          grep -q 'swipe-controller-v8.js' js/ui/gameplay-polish-v7s.js
          grep -q 'builder-checklist-v8.js' js/ui/gameplay-polish-v7s.js
          grep -q 'interaction-fixes-v8.js' service-worker.js
          grep -q 'hp-manager-v8.js' service-worker.js
          grep -q 'hp-v8.css' service-worker.js
          grep -q 'character-sheet-v8-hp-temp-1' service-worker.js
