name: Validate QOL fixes
on:
  push:
    branches: [main, v8-qol-wallet-builder-fixes, v8-native-swipe-restore, v8-hp-temp-manager, v8-features-npc-swipe-stability]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check js/core/state-events-v8.js
          node --check js/ui/interaction-fixes-v8.js
          node --check js/ui/hp-manager-v8.js
          node --check js/ui/character-builder-v7s.js
          node --check js/ui/npc-photo-v8.js
          node --check js/ui/builder-checklist-v8.js
          node --check js/ui/gameplay-polish-v7s.js
          node --check service-worker.js
      - name: Builder and feature guards
        run: |
          grep -q 'type="hidden" id="bStartMelee"' js/ui/interaction-fixes-v8.js
          grep -q 'patchExpertise' js/ui/interaction-fixes-v8.js
          grep -q 'patchMastery' js/ui/interaction-fixes-v8.js
          grep -q 'data-feature-choice' js/ui/interaction-fixes-v8.js
          grep -q 'stopImmediatePropagation' js/ui/interaction-fixes-v8.js
          grep -q 'Choose weapon type' js/ui/interaction-fixes-v8.js
          grep -q 'Starting equipment is not forced' js/ui/interaction-fixes-v8.js
          ! grep -q 'new MutationObserver' js/ui/interaction-fixes-v8.js
          ! grep -q 'new MutationObserver' js/ui/character-builder-v7s.js
          grep -q 'MASTERY_WEAPONS' js/ui/character-builder-v7s.js
      - name: Money and temp HP guards
        run: |
          test -s css/qol-fixes-v8.css
          test -s css/hp-v8.css
          grep -q 'moneyDialog' js/ui/interaction-fixes-v8.js
          grep -q "\['gp','GP','G'\]" js/ui/interaction-fixes-v8.js
          grep -q "\['ep','EP','E'\]" js/ui/interaction-fixes-v8.js
          grep -q "\['sp','SP','S'\]" js/ui/interaction-fixes-v8.js
          grep -q "\['cp','CP','C'\]" js/ui/interaction-fixes-v8.js
          ! grep -q 'data-coin-step' js/ui/interaction-fixes-v8.js
          grep -q 'TEMP ' js/ui/interaction-fixes-v8.js
          grep -q 'money-wallet' css/qol-fixes-v8.css
          grep -q 'money-edit-grid' css/qol-fixes-v8.css
          grep -q 'h.temp-=absorbed' js/ui/hp-manager-v8.js
          grep -q 'absorbed by Temp HP' js/ui/hp-manager-v8.js
          grep -q 'hpAmountWheel' js/ui/hp-manager-v8.js
          grep -q 'hpAmountInput' js/ui/hp-manager-v8.js
      - name: Pager and feature stability guards
        run: |
          grep -q 'scroll-snap-type:x mandatory' css/v7s.css
          grep -q 'touch-action:pan-x pan-y' css/v7s.css
          ! grep -q "'css/swipe-v8.css'" js/ui/gameplay-polish-v7s.js
          ! grep -q "'js/ui/swipe-controller-v8.js'" js/ui/gameplay-polish-v7s.js
          grep -q '#featuresPage .row-card.open .row-detail' css/stability-v8.css
          grep -q 'S.subscribe' js/ui/character-builder-v7s.js
          grep -q '__stableSubscribeV8' js/core/state-events-v8.js
          grep -q 'state-events-v8.js' js/ui/gameplay-polish-v7s.js
      - name: NPC portrait guards
        run: |
          test -s js/ui/npc-photo-v8.js
          test -s css/stability-v8.css
          grep -q 'data-npc-gallery' js/ui/npc-photo-v8.js
          grep -q 'data-npc-camera' js/ui/npc-photo-v8.js
          grep -q 'capture="environment"' js/ui/npc-photo-v8.js
          grep -q 'V7SPortraitCropper' js/ui/npc-photo-v8.js
          grep -q 'DataTransfer' js/ui/npc-photo-v8.js
      - name: Wiring
        run: |
          grep -q 'interaction-fixes-v8.js' js/ui/gameplay-polish-v7s.js
          grep -q 'hp-manager-v8.js' js/ui/gameplay-polish-v7s.js
          grep -q 'npc-photo-v8.js' js/ui/gameplay-polish-v7s.js
          grep -q 'stability-v8.css' js/ui/gameplay-polish-v7s.js
          grep -q 'hp-v8.css' js/ui/gameplay-polish-v7s.js
          grep -q 'qol-fixes-v8.css' js/ui/gameplay-polish-v7s.js
          grep -q 'builder-checklist-v8.js' js/ui/gameplay-polish-v7s.js
          grep -q 'state-events-v8.js' service-worker.js
          grep -q 'npc-photo-v8.js' service-worker.js
          grep -q 'stability-v8.css' service-worker.js
          grep -q 'character-sheet-v8-stability-npc-2' service-worker.js
